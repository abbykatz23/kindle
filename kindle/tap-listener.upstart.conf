# Kindle-side upstart job (not systemd — the Kindle's init system) that keeps
# kindle/tap_listener.sh running persistently, including across Kindle
# reboots. Discovered already installed and running on the current Kindle
# (`initctl status tap-listener`); backed up here since /etc/upstart/ lives
# on the Kindle's own filesystem and isn't captured anywhere else.
#
# Install on a new/rejailbroken Kindle:
#   mntroot rw
#   cp kindle/tap-listener.upstart.conf /etc/upstart/tap-listener.conf
#   mntroot ro
#   initctl start tap-listener       # starts it now; framework_ready also
#                                     # triggers it automatically on boot

start on framework_ready
stop on stopping framework

respawn

script
    exec /bin/sh /mnt/us/kindle/tap_listener.sh
end script
