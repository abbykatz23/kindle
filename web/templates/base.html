<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Running Plan{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="nav">
    </nav>

    <main class="main">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash flash--{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

    {# ── Claude generation modal (shared across all pages) ── #}
    <div id="claude-modal-overlay" class="modal-overlay" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="claude-modal-title">
        <div class="modal">
            <h2 class="modal__title" id="claude-modal-title">✦ Generate with Claude</h2>

            <div id="claude-modal-warning" class="modal__warning" style="display:none;"></div>

            <div class="modal__section" id="claude-modal-intensity">
                <label class="modal__label">Week intensity</label>
                <div class="intensity-toggle" role="group" aria-label="Week intensity">
                    <button type="button" class="intensity-btn" data-intensity="light">Light</button>
                    <button type="button" class="intensity-btn intensity-btn--active" data-intensity="normal">Normal</button>
                    <button type="button" class="intensity-btn" data-intensity="intense">Intense</button>
                </div>
            </div>

            <div class="modal__section">
                <label class="modal__label" for="claude-custom-prompt">Custom instructions <span class="modal__optional">(optional)</span></label>
                <textarea id="claude-custom-prompt" class="modal__textarea" placeholder="e.g. Exclude Wednesday from scheduling and redistribute those tasks across the remaining days." rows="3"></textarea>
            </div>

            <div class="modal__actions">
                <button type="button" class="btn btn--ghost" id="claude-modal-cancel">Cancel</button>
                <button type="button" class="btn btn--claude" id="claude-modal-confirm">Generate</button>
            </div>
        </div>
    </div>
</body>
</html>
